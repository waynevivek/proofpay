services:
  - type: web
    name: proofpay-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: sh -c 'cd backend && PYTHONPATH=. python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: PYTHONUNBUFFERED
        value: true
      # Allow all Vercel deployments + localhost
      - key: FRONTEND_ORIGINS
        value: https://proofpay.vercel.app,https://proofpay-qcke.onrender.com,http://localhost:3000,http://127.0.0.1:3000
      # Database: SQLite for demo. Replace value with a postgres:// URL for persistence.
      - key: DATABASE_URL
        value: sqlite:///./proofpay.db

