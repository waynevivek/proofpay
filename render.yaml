services:
  - type: web
    name: proofpay-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt && pip install python-dotenv
    startCommand: sh -c 'cd backend && PYTHONPATH=. python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    envVars:
      - key: PYTHONUNBUFFERED
        value: true
      - key: FRONTEND_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000
        scope: pr
      - key: DATABASE_URL
        scope: pr
